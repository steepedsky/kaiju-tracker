<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101216">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Kaiju tracker for @kaijuinvestor. Movies, TV and anime, games, and figures.">
  <title>Kaiju Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101216'/%3E%3Cpath fill='%237adfff' d='M4.8 25.2 8.2 12.2 11.4 25.2z'/%3E%3Cpath fill='%23e7f8ff' d='M12.2 25.2 16 5.2 19.8 25.2z'/%3E%3Cpath fill='%237adfff' d='M20.6 25.2 23.8 13.4 27.2 25.2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#panel">Skip to list</a>

  <header class="hero">
    <div class="hero-photo" aria-hidden="true"></div>
    <div class="wrap hero-row">
      <a class="brand" href="#movies">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#172027"/>
          <path fill="#7adfff" d="M4.8 25.2 8.2 12.2 11.4 25.2z"/>
          <path fill="#e7f8ff" d="M12.2 25.2 16 5.2 19.8 25.2z"/>
          <path fill="#7adfff" d="M20.6 25.2 23.8 13.4 27.2 25.2z"/>
        </svg>
        <h1>Kaiju Tracker</h1>
      </a>
      <a class="handle" href="https://x.com/kaijuinvestor">@kaijuinvestor</a>
    </div>
  </header>

  <div class="sentinel" id="dock-sentinel" aria-hidden="true"></div>
  <div class="dock" id="dock">
    <div class="wrap dock-content">
      <div class="tabs-wrap">
        <div class="tabs" role="tablist" aria-label="Lists">
          <button type="button" role="tab" id="tab-movies" aria-controls="panel" aria-selected="true">
            Movies <span class="tab-count" data-count="movies"></span>
          </button>
          <button type="button" role="tab" id="tab-tv" aria-controls="panel" aria-selected="false" tabindex="-1">
            TV &amp; Anime <span class="tab-count" data-count="tv"></span>
          </button>
          <button type="button" role="tab" id="tab-games" aria-controls="panel" aria-selected="false" tabindex="-1">
            Games <span class="tab-count" data-count="games"></span>
          </button>
          <button type="button" role="tab" id="tab-figures" aria-controls="panel" aria-selected="false" tabindex="-1">
            Figures <span class="tab-count" data-count="figures"></span>
          </button>
        </div>
      </div>

      <div class="progress">
        <div class="progress-row">
          <p class="progress-label" id="progress-label" aria-live="polite">Loading the list…</p>
          <p class="progress-pct" id="progress-pct" aria-hidden="true"></p>
        </div>
        <div class="meter" aria-hidden="true">
          <span class="meter-fill" id="meter-fill"></span>
        </div>
      </div>

      <div class="tools">
        <label class="search">
          <span class="sr-only">Search</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16 16.5 20.5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="Search" aria-label="Search titles, groups, and notes" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button type="button" id="clear-search" aria-label="Clear search" hidden>&times;</button>
        </label>
        <label class="sort">
          <span class="sr-only">Sort</span>
          <select id="sort">
            <option value="group">By group</option>
            <option value="year-desc">Newest year</option>
            <option value="year-asc">Oldest year</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
            <option value="status">Still to do</option>
          </select>
        </label>
      </div>

      <div class="chip-wrap">
        <div id="chips" class="chips" role="radiogroup" aria-label="Filter by group"></div>
      </div>
    </div>
  </div>

  <main class="wrap" id="main">
    <h2 id="list-heading" class="sr-only">Movies</h2>
    <p id="showing" class="showing" aria-live="polite"></p>
    <div id="panel" role="tabpanel" aria-labelledby="tab-movies" tabindex="-1"></div>
  </main>

  <footer class="wrap footer">
    <p>A watchlist kept by <a href="https://x.com/kaijuinvestor">@kaijuinvestor</a>.</p>
    <p class="credit">Backdrop: production still of the 1954 Godzilla suit, from <cite>Godzilla</cite> (1954). Photograph by Toho Company Ltd. Public domain in Japan and the United States. <a href="https://commons.wikimedia.org/wiki/File:Godzilla_(1954).jpg">Wikimedia Commons</a>, 2,617 × 2,022.</p>
  </footer>

  <noscript>
    <p class="wrap noscript">This page needs JavaScript to load the lists.</p>
  </noscript>
  <script src="app.js"></script>
</body>
</html>
